name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: mesajusta_test
          POSTGRES_USER: mesajusta
          POSTGRES_PASSWORD: mesajusta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Unit Tests
        run: npm run test:unit
        env:
          DATABASE_URL: postgresql://mesajusta:mesajusta_test@localhost:5432/mesajusta_test
          JWT_SECRET: test-jwt-secret
          JWT_REFRESH_SECRET: test-refresh-secret

      - name: Integration Tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://mesajusta:mesajusta_test@localhost:5432/mesajusta_test
          JWT_SECRET: test-jwt-secret
          JWT_REFRESH_SECRET: test-refresh-secret
